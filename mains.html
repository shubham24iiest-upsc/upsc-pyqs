<script>
// General Studies IV
// Add one entry per year inside `data`, same shape as data/gs1.js:
//   2025: { fmt: "150 words (Q1–10, 10 marks) · 250 words (Q11–20, 15 marks)", questions: [
//     {n:1, t:"<one of the topics below, spelled exactly>", q:"Question text", m:"10"},
//   ]},
// The tab switches on automatically once at least one year is present.
window.PYQ = window.PYQ || {};
window.PYQ.gs4 = {
  code: "GS4",
  name: "General Studies IV",
  pdfPrefix: "GS4",   // PDFs live at papers/GS4-YEAR.pdf (case-sensitive)
  roman: "IV",
  blurb: "Theory questions are grouped by syllabus area, and Section B case studies sit in their own block since they read differently.",
  topics: [
    "Ethics & Human Interface",
    "Attitude",
    "Aptitude & Foundational Values",
    "Emotional Intelligence",
    "Moral Thinkers & Philosophers",
    "Public Service Values & Ethics in Administration",
    "Probity in Governance",
    "Case Studies"
  ],
  data: {
  }
};
</script>
<script>
const PAPER_KEYS = ['gs1','gs2','gs3','gs4'];
const PAPERS = window.PYQ || {};

const yearsOf = key => Object.keys((PAPERS[key] && PAPERS[key].data) || {}).map(Number).sort((a,b) => b - a);
const isLoaded = key => yearsOf(key).length > 0;

function initialPaper(){
  const h = location.hash.replace('#','').toLowerCase();
  if (PAPER_KEYS.includes(h)) return h;
  return PAPER_KEYS.find(isLoaded) || 'gs1';
}

let currentPaper = initialPaper();
let currentYear = yearsOf(currentPaper)[0];

function renderTabs(){
  const el = document.getElementById('gsTabs');
  el.innerHTML = PAPER_KEYS.map(k => {
    const p = PAPERS[k] || { code: k.toUpperCase(), name: '' };
    const n = yearsOf(k).length;
    const tag = n ? `${n} year${n>1?'s':''} loaded` : 'awaiting PDFs';
    const cls = ['gs-tab', k===currentPaper ? 'active' : '', n ? '' : 'disabled'].join(' ');
    return `<button class="${cls}" role="tab" aria-selected="${k===currentPaper}" data-paper="${k}">
      <div class="gs-code">${p.code}</div><div class="gs-label">${p.name}</div><div class="gs-tag">${tag}</div>
    </button>`;
  }).join('');
  el.querySelectorAll('.gs-tab').forEach(t => t.addEventListener('click', () => selectPaper(t.dataset.paper)));
}

function selectPaper(key){
  if (key === currentPaper) return;
  currentPaper = key;
  const ys = yearsOf(key);
  // keep the same year when switching papers, if that year exists
  if (!ys.includes(currentYear)) currentYear = ys[0];
  history.replaceState(null, '', '#' + key);
  renderAll();
}

function renderHeader(){
  const p = PAPERS[currentPaper];
  const n = yearsOf(currentPaper).length;
  const label = `GS Paper ${p.roman}`;
  document.title = `${p.code} Mains Archive — PYQ Ledger`;
  document.getElementById('crumbPaper').textContent = label;
  document.getElementById('pageTitle').textContent = `${label} — Previous Year Questions`;
  document.getElementById('pageSub').textContent = n
    ? `All ${n} year${n>1?'s':''}, arranged by syllabus topic within each year. ${p.blurb}`
    : p.blurb;
}

function renderYearStrip(){
  const el = document.getElementById('yearRow');
  el.innerHTML = yearsOf(currentPaper).map(y =>
    `<button class="year-chip ${currentYear===y?'active':''}" data-year="${y}">${y}</button>`).join('');
  el.querySelectorAll('.year-chip').forEach(c => c.addEventListener('click', () => {
    currentYear = parseInt(c.dataset.year); renderAll();
  }));
}

function renderDownload(){
  const p = PAPERS[currentPaper];
  const d = p.data[currentYear];
  document.getElementById('downloadLabel').textContent = `GS Paper ${p.roman} · ${currentYear}`;
  document.getElementById('downloadFmt').textContent = d.fmt || '';
  const btn = document.getElementById('downloadBtn');
  // pdfPrefix in the data file sets the file name, e.g. "GS2" → papers/GS2-2025.pdf
  btn.href = `papers/${p.pdfPrefix || currentPaper}-${currentYear}.pdf`;
  btn.setAttribute('download', `${p.code}-${currentYear}.pdf`);
}

function renderTopics(){
  const p = PAPERS[currentPaper];
  const d = p.data[currentYear];
  const el = document.getElementById('topicArea');
  const nav = document.getElementById('topicNav');
  const grouped = {};
  d.questions.forEach(q => { (grouped[q.t] = grouped[q.t] || []).push(q); });

  // listed topics in syllabus order, then any unlisted topic so no question is silently dropped
  const order = p.topics.filter(t => grouped[t]).concat(Object.keys(grouped).filter(t => !p.topics.includes(t)));
  nav.innerHTML = order.map(t => `<div class="topic-pill"><span class="n">${grouped[t].length}</span>${t}</div>`).join('');

  el.innerHTML = order.map(topic => `
    <div class="topic-group">
      <div class="topic-head">
        <div class="topic-name">${topic}</div>
        <div class="topic-count mono">${grouped[topic].length} question${grouped[topic].length>1?'s':''}</div>
      </div>
      ${grouped[topic].map(q => `
        <div class="qrow">
          <div class="qnum">Q${q.n}</div>
          <div class="qtext">${q.q}</div>
          <div class="qmarks">${q.m} marks</div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function renderEmpty(){
  const p = PAPERS[currentPaper];
  document.getElementById('paperBody').innerHTML = `
    <div class="empty-note"><b>GS Paper ${p.roman} is on its way.</b><br>
    Questions for this paper haven't been added yet. Meanwhile, the other loaded papers are a tab away.</div>`;
}

let bodyTemplate = null;
function renderAll(){
  const body = document.getElementById('paperBody');
  if (bodyTemplate === null) bodyTemplate = body.innerHTML;
  renderTabs();
  renderHeader();
  if (!isLoaded(currentPaper)) { renderEmpty(); return; }
  if (!document.getElementById('yearRow')) body.innerHTML = bodyTemplate;
  renderYearStrip();
  renderDownload();
  renderTopics();
}

window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#','').toLowerCase();
  if (PAPER_KEYS.includes(h)) selectPaper(h);
});
renderAll();
</script>
</body>
