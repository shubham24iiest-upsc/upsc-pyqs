<style>
:root{
  /* light: pastel lavender paper */
  --ink:#F6F5FA; --surface:#FFFFFF; --surface-2:#F0EEF7; --rule:#E3E0EE;
  --text:#25222F; --muted:#615C74; --faint:#8C87A0;
  --marigold:#6C63D9; --on-accent:#FFFFFF; --marigold-soft:#ECEAFD;
  --pink:#D6587C; --pink-soft:#FCE8EE; --mint:#2E9C7B; --mint-soft:#E1F4EC;
  --peach:#F6C9A8; --glass:rgba(246,245,250,.88);
  --accent-glow:rgba(108,99,217,.22);
  --shadow:0 1px 2px rgba(37,34,47,.04), 0 10px 30px -18px rgba(37,34,47,.18);
  --display:'IBM Plex Serif', Georgia, 'Times New Roman', serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius:14px;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --ink:#16151D; --surface:#1F1E28; --surface-2:#292734; --rule:#353242;
  --text:#EEECF6; --muted:#ADA9C2; --faint:#7F7B95;
  --marigold:#B3AEF7; --on-accent:#16151D; --marigold-soft:rgba(179,174,247,.14);
  --pink:#F4A6BC; --pink-soft:rgba(244,166,188,.13); --mint:#93DDC3; --mint-soft:rgba(147,221,195,.12);
  --peach:#F6C9A8; --glass:rgba(22,21,29,.88);
  --accent-glow:rgba(179,174,247,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{ transition:background .25s, color .25s; background:var(--ink); color:var(--text); font-family:var(--body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
:focus-visible{ outline:2px solid var(--marigold); outline-offset:3px; border-radius:4px; }
.wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

/* header */
.site-head{ position:sticky; top:0; z-index:30; background:var(--glass); -webkit-backdrop-filter:saturate(1.3) blur(12px); backdrop-filter:saturate(1.3) blur(12px); border-bottom:1px solid transparent; transition:border-color .2s, box-shadow .2s; }
.site-head.scrolled{ border-bottom-color:var(--rule); box-shadow:0 6px 20px -16px rgba(0,0,0,.35); }

<script>
/* Files live in the papers/ folder, named exactly like:
     papers/PRE-GS1-2025.pdf       papers/PRE-GS1-2025-KEY.pdf
     papers/PRE-CSAT-2025.pdf      papers/PRE-CSAT-2025-KEY.pdf
   Nothing to edit here: the page checks which files exist when it loads.
   A year appears as soon as its paper or key is uploaded, and any file
   that isn't there yet shows a "coming soon" label instead of a broken link. */
const PAPERS = {
  gs1: {
    code: "GS I", name: "General Studies I", prefix: "PRE-GS1",
    note: "<b>100 questions · 200 marks · 2 hours.</b> This paper decides your Prelims cut-off. Negative marking: one-third of the marks for a question are deducted for each wrong answer."
  },
  csat: {
    code: "CSAT", name: "General Studies II (CSAT)", prefix: "PRE-CSAT",
    note: "<b>80 questions · 200 marks · 2 hours.</b> Qualifying since 2015: you need 33% (66 marks) and the score does not count toward the cut-off. In 2013 and 2014 it was added to the merit score. Negative marking: one-third per wrong answer."
  }
};
const FIRST_YEAR = 2013;
const LAST_YEAR = new Date().getFullYear() + 1;   // looks one year ahead, so nothing is missed around New Year

const KEYS = Object.keys(PAPERS);
const YEARS = []; for (let y = LAST_YEAR; y >= FIRST_YEAR; y--) YEARS.push(y);
const url = (p, y, key) => `papers/${p.prefix}-${y}${key ? '-KEY' : ''}.pdf`;
let current = KEYS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'gs1';
const found = {};          // found[k][y] = {paper:bool, key:bool}
let checked = false;

async function exists(path){
  if (location.protocol === 'file:') return true;   // local preview: can't check, assume present
  try {
    const r = await fetch(path, { method: 'HEAD', cache: 'no-cache' });
    return r.ok;
  } catch (e) { return false; }
}

// Papers already in the papers/ folder (1 = paper, 2 = key, 3 = both), so the list shows instantly.
// Anything not listed here is still looked for in the background, so a newly uploaded PDF shows up on its own.
const KNOWN = {"gs1":{"2014":3,"2015":3,"2016":3,"2017":3,"2018":3,"2019":3,"2020":3,"2021":3,"2022":3,"2023":3,"2024":3,"2025":3,"2026":3},"csat":{"2014":3,"2015":3,"2016":3,"2017":3,"2018":3,"2019":3,"2020":3,"2021":3,"2022":3,"2023":3,"2024":3,"2025":3,"2026":3}};
function checkFiles(){
  for (const k of KEYS) for (const y of YEARS) { const v = (KNOWN[k]||{})[y] || 0; (found[k] = found[k] || {})[y] = { paper: !!(v & 1), key: !!(v & 2) }; }
  checked = true;
  return Promise.resolve();
}
async function discoverNew(){
  let added = false;
  await Promise.all(KEYS.flatMap(k => YEARS.flatMap(y => [false, true].map(async key => {
    const f = found[k][y], has = key ? f.key : f.paper;
    if (has) return;
    if (await exists(url(PAPERS[k], y, key))) { if (key) f.key = true; else f.paper = true; added = true; }
  }))));
  if (added) { renderTabs(); renderYears(); }
}

const shownYears = k => YEARS.filter(y => { const f = found[k] && found[k][y]; return f && (f.paper || f.key); });

aphy": 7, "Environment and Ecology": 9, "Economy": 17, "Agriculture": 1, "Places in News": 3, "Science and Technology": 15, "Miscellaneous": 5, "Indian Polity and Governance": 9, "International Relations": 12}};   // GS I: questions per subject in each year (filled in by build_site.py)

{ const m = location.hash.match(/^#(gs1|csat)(?:-(\d{4}))?$/); if (m){ current=m[1]; if (m[2]) curYear=+m[2]; } }

<script>
/* ---------- question search (GS I questions + official answers) ---------- */
(function(){
  const $=id=>document.getElementById(id), esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let DATA=null, loading=null, shown=30, lastKey='';
  // the question file sits next to this page (prelims-gs1.js); data/prelims-gs1.js also works
  const tryLoad=src=>new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=src; sc.onload=()=>window.PRE_SEARCH?res():rej(); sc.onerror=rej; document.head.appendChild(sc); });
  const load=()=>loading||(loading=(window.PRE_SEARCH?Promise.resolve():tryLoad('prelims-gs1.js').catch(()=>tryLoad('data/prelims-gs1.js')))
    .then(()=>{ DATA=window.PRE_SEARCH; fill(); })
    .catch(e=>{ loading=null; failed=true; throw e; }));
  let failed=false;
  function fill(){
    if(!DATA || $('psY').options.length>1) return;
    Object.keys(DATA.years).sort((a,b)=>b-a).forEach(y=>$('psY').add(new Option(y,y)));
    DATA.subjects.forEach(s=>$('psS').add(new Option(s,s)));
    fillTopics();
  }
  // topics of the chosen subject; with no subject, every topic grouped under its subject
  function fillTopics(){
    if(!DATA) return;
    const sel=$('psT'), keep=sel.value, sub=$('psS').value, by={};
    DATA.qs.forEach(r=>{ if(r[3] && r[3]!==r[2]) (by[r[2]]=by[r[2]]||new Set()).add(r[3]); });
    sel.innerHTML='<option value="">All topics</option>';
    (sub?[sub]:DATA.subjects).forEach(s=>{ const ts=[...(by[s]||[])].sort(); if(!ts.length) return;
      const g=sub?sel:document.createElement('optgroup'); if(!sub){ g.label=s; sel.appendChild(g); }
      ts.forEach(t=>g.appendChild(new Option(t,t))); });
    sel.value=[...sel.options].some(o=>o.value===keep)?keep:'';
  }
  const store=()=>{ try{ return JSON.parse(localStorage.getItem('pyq-prelims')||'{}'); }catch(e){ return {}; } };
  const norm=t=>t.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'');
  const active=()=> $('psQ').value.trim().length>=2 || $('psY').value || $('psS').value || $('psT').value;
  function hl(text,terms){ let h=esc(text); if(!terms.length) return h;
    const re=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'); return h.replace(re,'<mark>$1</mark>'); }
  function run(){
    $('ps').classList.toggle('has-q', !!$('psQ').value);
    if(!active()){ if(document.body.classList.contains('searching')){ document.body.classList.remove('searching'); $('pv').classList.remove('detail'); origRender(); } return; }
    document.body.classList.add('searching'); $('pv').classList.add('detail');
    if(!DATA){ $('detail').innerHTML='<div class="pv-in"><p class="sr-empty">Loading questions…</p></div>';
      load().then(run).catch(()=>{ $('detail').innerHTML='<div class="pv-in"><p class="sr-empty">The question list could not be loaded. Check your connection and try again.</p></div>'; }); return; }
    const q=$('psQ').value.trim(), terms=norm(q).split(/\s+/).filter(t=>t.length>1), y=$('psY').value, sub=$('psS').value, tp=$('psT').value;
    const key=[q,y,sub,tp].join('|'); if(key!==lastKey){ shown=30; lastKey=key; }
    const res=DATA.qs.filter(r=>{ const id=r[0]+'-'+r[1];
      if(y && r[0]!=y) return false; if(sub && r[2]!==sub) return false;
      if(tp && r[3]!==tp) return false;
      if(terms.length){ const hay=norm(r[4]+' '+r[5].join(' ')+' '+r[2]+' '+r[3]); return terms.every(t=>hay.includes(t)); }
      return true; });
    const what=[q?`“${esc(q)}”`:'', y?esc(y):'', tp?esc(tp):(sub?esc(sub):'')].filter(Boolean).join(' · ');
    let h=`<div class="pv-in"><button class="pv-back" id="srBack">‹ Papers</button><div class="sr-head"><h2><b>${res.length.toLocaleString('en-IN')}</b> question${res.length===1?'':'s'}${what?' · '+what:''}</h2><button class="sr-clear" id="srClear" type="button">Clear search</button></div>`;
    if(!res.length) h+=`<p class="sr-empty">No GS I question matches that. Try a shorter word, a different spelling, or clear the year and subject filters.</p>`;
    res.slice(0,shown).forEach(r=>{ const [yy,n,s,t,qt,o,a]=r, kt=(DATA.years[yy]||{}).key||'Official answer key';
      h+=`<article class="sr"><div class="sr-meta"><span class="yq">${yy} · Q${n}</span><span class="tg">${esc(s)}</span>${t&&t!==s?`<span class="tg">${esc(t)}</span>`:''}</div>
      <div class="sr-q">${hl(qt,terms)}</div>
      <div class="sr-opts">${o.map((x,i)=>{ const l='abcd'[i]; return `<div class="sr-o${l===a?' ok':''}"><b>(${l})</b><span>${hl(x,terms)}</span></div>`; }).join('')}</div>
      <div class="sr-ans">${a==='x'?`<span class="drop">Dropped by UPSC</span><span>No answer counted in the ${esc(kt.toLowerCase())}</span>`:`<strong>Answer (${a})</strong><span>${esc(kt)}${/provisional/i.test(kt)?' · may change when the final key is released':''}</span>`}</div></article>`; });
    if(res.length>shown) h+=`<button class="sr-more" id="srMore" type="button">Show ${Math.min(30,res.length-shown)} more of ${res.length-shown} remaining</button>`;
    h+='</div>'; $('detail').innerHTML=h;
    const m=$('srMore'); if(m) m.onclick=()=>{ shown+=30; run(); };
    $('srClear').onclick=clear; $('srBack').onclick=clear;
  }
  function clear(){ $('psQ').value=''; $('psY').value=''; $('psS').value=''; $('psT').value=''; run(); $('detail').scrollTop=0; }
  const origRender=renderDetail;
  renderDetail=function(){ if(document.body.classList.contains('searching')){ $('psQ').value=''; $('psY').value=''; $('psS').value=''; $('psT').value=''; $('ps').classList.remove('has-q'); document.body.classList.remove('searching'); } return origRender.apply(this,arguments); };
  let tmr; $('psQ').addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ $('detail').scrollTop=0; run(); },180); });
  ['psY','psT'].forEach(id=>$(id).addEventListener('change',()=>{ $('detail').scrollTop=0; run(); }));
  $('psS').addEventListener('change',()=>{ fillTopics(); $('detail').scrollTop=0; run(); });
  // picking a topic while "All subjects" is set also selects its subject
  $('psT').addEventListener('change',()=>{ if(!DATA||!$('psT').value||$('psS').value) return; const r=DATA.qs.find(r=>r[3]===$('psT').value); if(r){ $('psS').value=r[2]; const t=$('psT').value; fillTopics(); $('psT').value=t; } });
  $('psX').onclick=()=>{ $('psQ').value=''; run(); $('psQ').focus(); };
  $('psQ').addEventListener('focus',()=>load().catch(()=>{}));
  ['psY','psS','psT'].forEach(id=>$(id).addEventListener('focus',()=>load().catch(()=>{})));
  setTimeout(()=>load().catch(()=>{}),1200);
})();
</script>
