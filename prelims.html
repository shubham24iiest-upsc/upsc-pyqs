<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prelims Archive — PYQ Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1EDE2; --paper-raised: #FAF8F1; --ink: #1E2A44; --ink-soft: #3A4763;
    --gold: #B8862E; --correct: #3D6B4F; --stamp-red: #9C3B3B;
    --charcoal: #2A2823; --charcoal-soft: #5B564C; --rule: #CBC2AC; --rule-soft: #DED6C0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background: var(--paper); color: var(--charcoal); font-family: 'Inter', sans-serif; line-height: 1.5; }
  a{color:inherit; text-decoration:none;}
  .wrap{ max-width: 1080px; margin: 0 auto; padding: 0 24px 60px; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }

  header{ border-bottom:1px solid var(--rule); padding:22px 0; margin-bottom: 8px; }
  .header-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:36px; height:36px; border:1.5px solid var(--ink); border-radius:3px; display:flex; align-items:center; justify-content:center; font-family:'Newsreader',serif; font-weight:700; font-size:16px; color:var(--ink); transform:rotate(-2deg); }
  .brand-name{ font-family:'Newsreader', serif; font-weight:700; font-size:19px; color:var(--ink); }
  .brand-name span{ color:var(--gold); font-style:italic; font-weight:600; }
  .crumb{ font-size:13px; color:var(--charcoal-soft); }
  .crumb b{ color:var(--ink); font-weight:600; }

  .page-title{ font-family:'Newsreader', serif; font-weight:600; font-size: clamp(26px, 3.4vw, 36px); color: var(--ink); margin: 28px 0 6px; }
  .page-sub{ font-size:14.5px; color:var(--charcoal-soft); margin-bottom:22px; max-width: 66ch; }

  .notice{
    background: rgba(184,134,46,0.09);
    border: 1px solid rgba(184,134,46,0.35);
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 12.5px;
    color: var(--charcoal-soft);
    margin-bottom: 26px;
  }
  .notice b{ color: var(--ink); }

  .gs-tabs{ display:grid; grid-template-columns: repeat(4, 1fr); border:1px solid var(--ink); border-radius: 6px; overflow:hidden; margin-bottom: 26px; }
  .gs-tab{ padding: 16px 10px; text-align:center; cursor:pointer; background: var(--paper-raised); border-right: 1px solid var(--rule); transition: background 0.15s ease; }
  .gs-tab:last-child{ border-right:none; }
  .gs-tab:hover{ background: #FFFDF7; }
  .gs-tab.active{ background: var(--ink); }
  .gs-tab.disabled{ opacity: 0.45; cursor: default; }
  .gs-code{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size: 13px; color: var(--gold); margin-bottom: 4px; }
  .gs-tab.active .gs-code{ color: #E3C171; }
  .gs-label{ font-family:'Newsreader', serif; font-weight:600; font-size: 15.5px; color: var(--ink); }
  .gs-tab.active .gs-label{ color: var(--paper-raised); }
  .gs-tag{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color: var(--charcoal-soft); margin-top:2px; }
  @media (max-width:640px){ .gs-tabs{ grid-template-columns: repeat(2,1fr); } .gs-tab{ border-bottom:1px solid var(--rule); } }

  .year-strip{ overflow-x:auto; padding-bottom: 6px; margin-bottom: 22px; }
  .year-row{ display:flex; gap:8px; min-width:max-content; }
  .year-chip{ font-family:'IBM Plex Mono', monospace; font-size: 13px; font-weight:500; padding: 8px 15px; border:1px solid var(--rule); border-radius: 999px; color: var(--charcoal-soft); white-space:nowrap; cursor:pointer; transition: all 0.15s ease; }
  .year-chip:hover{ border-color:var(--ink); color:var(--ink); }
  .year-chip.active{ background:var(--ink); border-color:var(--ink); color:var(--paper-raised); }

  .download-bar{ display:flex; align-items:center; justify-content:space-between; background: var(--paper-raised); border:1px solid var(--rule); border-radius:6px; padding: 16px 20px; margin-bottom: 30px; flex-wrap: wrap; gap: 12px; }
  .download-info{ font-size:13.5px; color:var(--charcoal-soft); }
  .download-info b{ color:var(--ink); font-family:'Newsreader',serif; font-size:15px; font-weight:600; }
  .download-info .fmt{ display:block; font-size: 11.5px; margin-top:2px; }
  .download-btn{ background: var(--ink); color: var(--paper-raised); border:none; padding: 11px 18px; border-radius:4px; font-weight:600; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:8px; transition: background 0.15s ease; }
  .download-btn:hover{ background: var(--ink-soft); }

  .topic-nav{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 30px; }
  .topic-pill{ font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:999px; background: var(--paper-raised); border:1px solid var(--rule-soft); color: var(--charcoal-soft); }
  .topic-pill .n{ color: var(--gold); margin-right:4px; }

  .topic-group{ margin-bottom: 38px; }
  .topic-head{ display:flex; align-items:baseline; gap: 12px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; margin-bottom: 16px; }
  .topic-name{ font-family:'Newsreader', serif; font-weight:600; font-size: 18px; color: var(--ink); }
  .topic-count{ font-size: 11.5px; color: var(--charcoal-soft); font-family:'IBM Plex Mono', monospace; }

  .qrow{ display:flex; gap: 14px; padding: 14px 4px; border-bottom: 1px dashed var(--rule-soft); font-size: 14.5px; }
  .qrow:last-child{ border-bottom:none; }
  .qnum{ font-family:'IBM Plex Mono', monospace; font-weight:600; color: var(--gold); flex-shrink:0; min-width: 32px; white-space: nowrap; }
  .qtext{ color: var(--charcoal); line-height:1.55; }
  .qmarks{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color: var(--charcoal-soft); flex-shrink:0; white-space:nowrap; }

  .empty-note{ border: 1px dashed var(--rule); border-radius: 6px; padding: 26px 24px; text-align:center; color: var(--charcoal-soft); font-size: 13.5px; background: var(--paper-raised); }
  .empty-note b{ color: var(--ink); }

  .gs-tab{ font: inherit; border-top:none; border-bottom:none; border-left:none; }
  .gs-tab:focus-visible, .year-chip:focus-visible, .download-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .gs-tab.disabled:hover{ background: var(--paper-raised); }
  .year-chip{ background: transparent; font-family:'IBM Plex Mono', monospace; }
  .download-btn.off{ opacity: 0.45; pointer-events: none; }

  .top-nav{ display:flex; gap:6px; font-size:13.5px; font-weight:600; }
  .top-nav a{ padding:7px 14px; border-radius:3px; color:var(--ink-soft); border:1px solid transparent; }
  .top-nav a:hover{ border-color: var(--rule); color: var(--ink); }
  .top-nav a.on{ background: var(--ink); color: var(--paper-raised); }
  .crumb-line{ margin-top: 18px; }

  .gs-tabs.two{ grid-template-columns: repeat(2, 1fr); }
  @media (max-width:640px){ .gs-tabs.two{ grid-template-columns: 1fr 1fr; } }
  .paper-note{ font-size:13px; color:var(--charcoal-soft); background:var(--paper-raised); border:1px solid var(--rule); border-left:3px solid var(--gold); border-radius:4px; padding:12px 16px; margin-bottom:22px; }
  .paper-note b{ color:var(--ink); }
  .year-list{ border:1px solid var(--rule); border-radius:6px; overflow:hidden; background:var(--paper-raised); margin-bottom:48px; }
  .yrow{ display:grid; grid-template-columns: 110px 1fr auto; align-items:center; gap:16px; padding:16px 20px; border-bottom:1px solid var(--rule-soft); }
  .yrow:last-child{ border-bottom:none; }
  .yrow:hover{ background:#FFFDF7; }
  .ynum{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:20px; color:var(--ink); }
  .ymeta{ font-size:12.5px; color:var(--charcoal-soft); }
  .ybtns{ display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .dl{ display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:4px; font-size:13px; font-weight:600; border:1px solid var(--ink); white-space:nowrap; transition: background .15s ease, color .15s ease; }
  .dl.paper{ background:var(--ink); color:var(--paper-raised); }
  .dl.paper:hover{ background:var(--ink-soft); }
  .dl.key{ background:transparent; color:var(--ink); }
  .dl.key:hover{ background:var(--ink); color:var(--paper-raised); }
  .dl.off{ border-color:var(--rule); color:var(--charcoal-soft); background:transparent; pointer-events:none; font-weight:500; }
  .dl:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  @media (max-width:640px){
    .yrow{ grid-template-columns: 1fr; gap:10px; padding:16px; }
    .ybtns{ justify-content:flex-start; }
    .dl{ flex:1; justify-content:center; }
  }
  .gs-tab.active .gs-tag{ color: #C9C3B3; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-row">
      <a href="index.html" class="brand">
        <div class="brand-mark">P</div>
        <div class="brand-name">PYQ <span>Ledger</span></div>
      </a>
      <nav class="top-nav"><a href="mains.html">Mains</a><a href="prelims.html" class="on">Prelims</a></nav>
    </div>
  </header>
  <div class="crumb crumb-line"><a href="index.html">Home</a> / Prelims / <b id="crumbPaper">General Studies I</b></div>

  <div class="page-title" id="pageTitle">Prelims — Question Papers &amp; Answer Keys</div>
  <div class="page-sub">Official UPSC Civil Services (Preliminary) papers with their official answer keys, year by year. Answer keys cover every booklet series, so match the key to the series printed on your paper.</div>

  <div class="gs-tabs two" id="tabs" role="tablist"></div>
  <div class="paper-note" id="paperNote"></div>
  <div class="year-list" id="yearList"></div>
</div>

<script>
/* Files live in the papers/ folder, named exactly like:
     papers/PRE-GS1-2025.pdf       papers/PRE-GS1-2025-KEY.pdf
     papers/PRE-CSAT-2025.pdf      papers/PRE-CSAT-2025-KEY.pdf
   Nothing to edit here: the page checks which files exist when it loads.
   A year appears as soon as its paper or key is uploaded, and any file
   that isn't there yet shows a "coming soon" label instead of a broken link. */
const PAPERS = {
  gs1: {
    code: "GS I", name: "General Studies I", prefix: "PRE-GS1",
    note: "<b>100 questions · 200 marks · 2 hours.</b> This paper decides your Prelims cut-off. Negative marking: one-third of the marks for a question are deducted for each wrong answer."
  },
  csat: {
    code: "CSAT", name: "General Studies II (CSAT)", prefix: "PRE-CSAT",
    note: "<b>80 questions · 200 marks · 2 hours.</b> Qualifying since 2015: you need 33% (66 marks) and the score does not count toward the cut-off. In 2013 and 2014 it was added to the merit score. Negative marking: one-third per wrong answer."
  }
};
const FIRST_YEAR = 2013;
const LAST_YEAR = new Date().getFullYear() + 1;   // looks one year ahead, so nothing is missed around New Year

const KEYS = Object.keys(PAPERS);
const YEARS = []; for (let y = LAST_YEAR; y >= FIRST_YEAR; y--) YEARS.push(y);
const url = (p, y, key) => `papers/${p.prefix}-${y}${key ? '-KEY' : ''}.pdf`;
let current = KEYS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'gs1';
const found = {};          // found[k][y] = {paper:bool, key:bool}
let checked = false;

async function exists(path){
  if (location.protocol === 'file:') return true;   // local preview: can't check, assume present
  try {
    const r = await fetch(path, { method: 'HEAD', cache: 'no-store' });
    return r.ok;
  } catch (e) { return false; }
}

async function checkFiles(){
  await Promise.all(KEYS.flatMap(k => YEARS.map(async y => {
    const [paper, key] = await Promise.all([exists(url(PAPERS[k], y, false)), exists(url(PAPERS[k], y, true))]);
    (found[k] = found[k] || {})[y] = { paper, key };
  })));
  checked = true;
}

const shownYears = k => YEARS.filter(y => { const f = found[k] && found[k][y]; return f && (f.paper || f.key); });

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = KEYS.map(k => {
    const p = PAPERS[k];
    let tag = 'checking files…';
    if (checked){
      const ys = shownYears(k);
      const papers = ys.filter(y => found[k][y].paper).length, keys = ys.filter(y => found[k][y].key).length;
      tag = `${papers} paper${papers===1?'':'s'} · ${keys} answer key${keys===1?'':'s'}`;
    }
    return `<button class="gs-tab ${k===current?'active':''}" role="tab" aria-selected="${k===current}" data-k="${k}">
      <div class="gs-code">${p.code}</div><div class="gs-label">${p.name}</div>
      <div class="gs-tag">${tag}</div></button>`;
  }).join('');
  el.querySelectorAll('.gs-tab').forEach(b => b.addEventListener('click', () => select(b.dataset.k)));
}

function btn(cls, href, label, ok, offLabel){
  const fname = href.split('/').pop();
  return ok
    ? `<a class="dl ${cls}" href="${href}" download="${fname}">↓ ${label}</a>`
    : `<span class="dl off" aria-disabled="true">${offLabel}</span>`;
}

function renderYears(){
  const p = PAPERS[current];
  document.getElementById('crumbPaper').textContent = p.name;
  document.title = `Prelims ${p.code} — PYQ Ledger`;
  document.getElementById('paperNote').innerHTML = p.note;
  const list = document.getElementById('yearList');
  if (!checked){ list.innerHTML = `<div class="yrow"><div class="ymeta">Checking which papers are available…</div></div>`; return; }
  const ys = shownYears(current);
  if (!ys.length){ list.innerHTML = `<div class="yrow"><div class="ymeta">No papers uploaded yet for this tab.</div></div>`; return; }
  list.innerHTML = ys.map(y => {
    const f = found[current][y];
    return `<div class="yrow">
      <div class="ynum">${y}</div>
      <div class="ymeta">CSE Prelims ${y} · ${p.name}</div>
      <div class="ybtns">
        ${btn('paper', url(p, y, false), 'Question paper', f.paper, 'Paper coming soon')}
        ${btn('key', url(p, y, true), 'Answer key', f.key, 'Key not yet released')}
      </div></div>`;
  }).join('');
}

function select(k){ if (k===current) return; current = k; history.replaceState(null,'','#'+k); renderTabs(); renderYears(); }
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (KEYS.includes(h)) select(h); });
renderTabs(); renderYears();
checkFiles().then(() => { renderTabs(); renderYears(); });
</script>
</body>
</html>
