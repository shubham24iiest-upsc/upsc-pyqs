<title>Prelims papers and answer keys — PrashnaKosh</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:wght@400;500;600;700&display=swap">
<style>
:root{
  /* light: pastel lavender paper */
  --ink:#F6F5FA; --surface:#FFFFFF; --surface-2:#F0EEF7; --rule:#E3E0EE;
  --text:#25222F; --muted:#615C74; --faint:#8C87A0;
  --marigold:#6C63D9; --on-accent:#FFFFFF; --marigold-soft:#ECEAFD;
  --pink:#D6587C; --pink-soft:#FCE8EE; --mint:#2E9C7B; --mint-soft:#E1F4EC;
  --peach:#F6C9A8; --glass:rgba(246,245,250,.88);
  --accent-glow:rgba(108,99,217,.22);
  --shadow:0 1px 2px rgba(37,34,47,.04), 0 10px 30px -18px rgba(37,34,47,.18);
  --display:'IBM Plex Serif', Georgia, 'Times New Roman', serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius:14px;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --ink:#16151D; --surface:#1F1E28; --surface-2:#292734; --rule:#353242;
  --text:#EEECF6; --muted:#ADA9C2; --faint:#7F7B95;
  --marigold:#B3AEF7; --on-accent:#16151D; --marigold-soft:rgba(179,174,247,.14);
  --pink:#F4A6BC; --pink-soft:rgba(244,166,188,.13); --mint:#93DDC3; --mint-soft:rgba(147,221,195,.12);
  --peach:#F6C9A8; --glass:rgba(22,21,29,.88);
  --accent-glow:rgba(179,174,247,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{ transition:background .25s, color .25s; background:var(--ink); color:var(--text); font-family:var(--body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
:focus-visible{ outline:2px solid var(--marigold); outline-offset:3px; border-radius:4px; }
.wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

/* header */
.site-head{ position:relative; z-index:5; }
.head-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 0; }
.brand{ display:flex; align-items:baseline; gap:10px; font-family:var(--display); font-weight:700; font-size:20px; letter-spacing:-.01em; white-space:nowrap; }
.brand-dot{ width:12px; height:12px; border-radius:50%; background:var(--marigold); display:inline-block; transform:translateY(1px); box-shadow:0 0 0 4px var(--marigold-soft); }
.brand small{ font-family:var(--body); font-weight:500; font-size:13px; color:var(--muted); letter-spacing:0; }
.top-nav{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--rule); border-radius:999px; padding:4px; }
.top-nav a{ padding:7px 16px; border-radius:999px; font-weight:600; font-size:14px; color:var(--muted); }
.top-nav a:hover{ color:var(--text); }
.top-nav a.on{ background:var(--marigold); color:var(--on-accent); }

.display{ font-family:var(--display); font-weight:400; letter-spacing:-.015em; line-height:1.12; color:var(--text); }
.display em{ font-style:italic; color:var(--marigold); }
.lede{ color:var(--muted); font-size:16.5px; max-width:62ch; line-height:1.7; }

.site-foot{ border-top:1px solid var(--rule); margin-top:72px; padding:28px 0 40px; color:var(--faint); font-size:13.5px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }

@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
@media (max-width:640px){ .wrap{ padding:0 16px; } .brand small{ display:none; } .brand{ font-size:19px; } .top-nav a{ padding:7px 13px; } }

/* theme toggle */
.head-right{ display:flex; align-items:center; gap:10px; }
.theme-toggle{ width:40px; height:40px; border-radius:50%; border:1px solid var(--rule); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--muted); box-shadow:var(--shadow); transition:color .15s, border-color .15s; }
.theme-toggle:hover{ color:var(--marigold); border-color:var(--marigold); }
.theme-toggle svg{ width:18px; height:18px; }
.theme-toggle .i-sun{ display:none; } :root[data-theme="dark"] .theme-toggle .i-sun{ display:block; } :root[data-theme="dark"] .theme-toggle .i-moon{ display:none; }
.top-nav{ box-shadow:var(--shadow); }
@media (max-width:640px){ .top-nav a{ padding:7px 11px; font-size:13px; } .theme-toggle{ width:36px; height:36px; } }
@media (max-width:440px){
  .head-row{ gap:8px; padding-top:16px; padding-bottom:16px; }
  .brand{ font-size:17px; gap:7px; }
  .brand-dot{ width:10px; height:10px; }
  .head-right{ gap:6px; }
  .top-nav{ padding:3px; }
  .top-nav a{ padding:6px 9px; font-size:12.5px; }
  .theme-toggle{ width:32px; height:32px; }
  .theme-toggle svg{ width:16px; height:16px; }
}
@media (max-width:380px){
  .brand{ font-size:15.5px; }
  .brand-dot{ display:none; }
  .top-nav a{ padding:6px 7px; font-size:12px; }
  .head-right{ gap:5px; }
}

html,body{ height:100%; }
body{ display:flex; flex-direction:column; }
.site-head{ flex-shrink:0; border-bottom:1px solid var(--rule); }
.pv{ flex:1; display:grid; grid-template-columns:300px minmax(0,1fr); min-height:0; }
.pv-list{ background:var(--surface); border-right:1px solid var(--rule); overflow:auto; display:flex; flex-direction:column; }
.pv-lh{ padding:16px 16px 12px; border-bottom:1px solid var(--rule); position:sticky; top:0; background:var(--surface); z-index:1; }
.pv-lh h1{ font-family:var(--display); font-weight:400; font-size:21px; line-height:1.2; }
.seg{ display:flex; gap:3px; background:var(--surface-2); border-radius:999px; padding:3px; margin-top:12px; }
.seg button{ flex:1; padding:7px 10px; border-radius:999px; font-size:13.5px; font-weight:700; color:var(--muted); }
.seg button.on{ background:var(--marigold); color:var(--on-accent); }
.yi{ display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; text-align:left; padding:11px 18px; border-bottom:1px solid var(--rule); }
.yi:hover{ background:var(--surface-2); }
.yi b{ font-family:var(--display); font-size:19px; }
.yi span{ font-size:12px; color:var(--faint); }
.yi.cur{ background:var(--marigold-soft); box-shadow:inset 3px 0 0 var(--marigold); }
.yi.cur b{ color:var(--marigold); }
.pv-msg{ padding:18px; color:var(--faint); font-size:14px; }
.pv-detail{ overflow:auto; }
.pv-in{ max-width:780px; padding:34px 44px 60px; }
.pv-kick{ font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
.pv-year{ font-family:var(--display); font-weight:700; font-size:clamp(44px,6vw,64px); line-height:1; color:var(--marigold); margin-top:6px; letter-spacing:-.02em; }
.pv-note{ color:var(--muted); font-size:15px; line-height:1.65; margin-top:14px; max-width:64ch; }
.pv-note b{ color:var(--text); }
.pv-acts{ display:flex; gap:10px; flex-wrap:wrap; margin-top:24px; }
.dl{ display:inline-flex; justify-content:center; align-items:center; gap:8px; padding:12px 18px; border-radius:999px; font-size:15px; font-weight:700; border:1px solid var(--rule); white-space:nowrap; background:var(--surface); }
.dl svg{ width:17px; height:17px; flex-shrink:0; }
.dl.paper{ background:var(--marigold); border-color:var(--marigold); color:var(--on-accent); box-shadow:0 6px 22px -6px var(--accent-glow); }
.dl.paper:hover{ filter:brightness(1.08); }
.dl.key{ color:var(--marigold); border:2px solid var(--marigold); }
.dl.key:hover{ background:var(--marigold); color:var(--on-accent); }
.dl.go{ color:var(--text); }
.dl.go:hover{ border-color:var(--marigold); color:var(--marigold); }
.dl.off{ color:var(--faint); font-weight:500; border-style:dashed; }
.pv-card{ margin-top:28px; background:var(--surface); border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px; }
.pv-card h2{ font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-bottom:10px; }
.pb{ display:grid; grid-template-columns:minmax(120px,210px) 1fr 30px; gap:10px; align-items:center; font-size:13.5px; margin:6px 0; }
.pb .t{ height:12px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
.pb .t i{ display:block; height:100%; border-radius:4px; background:var(--marigold); }
.pb b{ text-align:right; color:var(--marigold); }
.pv-foot{ margin-top:30px; font-size:13px; color:var(--faint); }
.pv-back{ display:none; margin-bottom:14px; font-weight:700; color:var(--marigold); font-size:14px; }
@media (max-width:760px){
  .pv{ grid-template-columns:1fr; }
  .pv-detail{ display:none; }
  .pv.detail .pv-list{ display:none; } .pv.detail .pv-detail{ display:block; }
  .pv-back{ display:inline-block; }
  .pv-in{ padding:18px 16px 40px; }
  .pb{ grid-template-columns:minmax(90px,140px) 1fr 26px; font-size:12.5px; }
}
</style>
</head>
<body>
<header class="site-head"><div class="wrap head-row">
  <a href="index.html" class="brand"><span class="brand-dot"></span>PrashnaKosh <small>UPSC CSE</small></a>
  <div class="head-right"><nav class="top-nav" aria-label="Sections"><a href="mains.html">Mains</a><a href="prelims.html" class="on">Prelims</a><a href="practice.html">Practice</a></nav><button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
</div></header>
<main class="pv" id="pv">
  <nav class="pv-list" aria-label="Years">
    <div class="pv-lh"><h1>Prelims papers and answer keys</h1><div class="seg" id="tabs" role="tablist" aria-label="Prelims papers"></div></div>
    <div id="yearList"></div>
  </nav>
  <section class="pv-detail" id="detail" aria-live="polite"></section>
</main>
<script>
/* Files live in the papers/ folder, named exactly like:
     papers/PRE-GS1-2025.pdf       papers/PRE-GS1-2025-KEY.pdf
     papers/PRE-CSAT-2025.pdf      papers/PRE-CSAT-2025-KEY.pdf
   Nothing to edit here: the page checks which files exist when it loads.
   A year appears as soon as its paper or key is uploaded, and any file
   that isn't there yet shows a "coming soon" label instead of a broken link. */
const PAPERS = {
  gs1: {
    code: "GS I", name: "General Studies I", prefix: "PRE-GS1",
    note: "<b>100 questions · 200 marks · 2 hours.</b> This paper decides your Prelims cut-off. Negative marking: one-third of the marks for a question are deducted for each wrong answer."
  },
  csat: {
    code: "CSAT", name: "General Studies II (CSAT)", prefix: "PRE-CSAT",
    note: "<b>80 questions · 200 marks · 2 hours.</b> Qualifying since 2015: you need 33% (66 marks) and the score does not count toward the cut-off. In 2013 and 2014 it was added to the merit score. Negative marking: one-third per wrong answer."
  }
};
const FIRST_YEAR = 2013;
const LAST_YEAR = new Date().getFullYear() + 1;   // looks one year ahead, so nothing is missed around New Year

const KEYS = Object.keys(PAPERS);
const YEARS = []; for (let y = LAST_YEAR; y >= FIRST_YEAR; y--) YEARS.push(y);
const url = (p, y, key) => `papers/${p.prefix}-${y}${key ? '-KEY' : ''}.pdf`;
let current = KEYS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'gs1';
const found = {};          // found[k][y] = {paper:bool, key:bool}
let checked = false;

async function exists(path){
  if (location.protocol === 'file:') return true;   // local preview: can't check, assume present
  try {
    const r = await fetch(path, { method: 'HEAD', cache: 'no-store' });
    return r.ok;
  } catch (e) { return false; }
}

async function checkFiles(){
  await Promise.all(KEYS.flatMap(k => YEARS.map(async y => {
    const [paper, key] = await Promise.all([exists(url(PAPERS[k], y, false)), exists(url(PAPERS[k], y, true))]);
    (found[k] = found[k] || {})[y] = { paper, key };
  })));
  checked = true;
}

const shownYears = k => YEARS.filter(y => { const f = found[k] && found[k][y]; return f && (f.paper || f.key); });

const PRE_SUBJ = {"2014": {"Agriculture": 7, "Environment and Ecology": 20, "Geography": 10, "Art and Culture": 12, "International Relations": 3, "Science and Technology": 13, "Modern Indian History": 5, "Indian Polity and Governance": 10, "Medieval Indian History": 3, "Ancient Indian History": 1, "Economy": 12, "Places in News": 3, "Miscellaneous": 1}, "2015": {"Economy": 17, "International Relations": 7, "Geography": 13, "Indian Polity and Governance": 13, "Environment and Ecology": 15, "Science and Technology": 8, "Agriculture": 5, "Modern Indian History": 8, "Places in News": 4, "Medieval Indian History": 4, "Ancient Indian History": 1, "Art and Culture": 5}, "2016": {"Indian Polity and Governance": 6, "Economy": 22, "Science and Technology": 13, "Environment and Ecology": 18, "Medieval Indian History": 3, "Art and Culture": 4, "Places in News": 1, "International Relations": 10, "Agriculture": 6, "Geography": 7, "Ancient Indian History": 3, "Modern Indian History": 6, "Miscellaneous": 1}, "2017": {"Indian Polity and Governance": 25, "Ancient Indian History": 2, "Economy": 19, "Environment and Ecology": 13, "Science and Technology": 9, "Art and Culture": 4, "Modern Indian History": 7, "International Relations": 7, "Geography": 9, "Agriculture": 3, "Medieval Indian History": 1, "Places in News": 1}, "2018": {"Indian Polity and Governance": 13, "Science and Technology": 13, "Agriculture": 8, "Environment and Ecology": 10, "Economy": 16, "International Relations": 6, "Modern Indian History": 13, "Places in News": 4, "Art and Culture": 6, "Geography": 7, "Ancient Indian History": 2, "Medieval Indian History": 1, "Miscellaneous": 1}, "2019": {"Medieval Indian History": 3, "Agriculture": 7, "Economy": 18, "Modern Indian History": 5, "Ancient Indian History": 4, "Art and Culture": 3, "Environment and Ecology": 19, "Indian Polity and Governance": 15, "Geography": 9, "Science and Technology": 12, "Places in News": 1, "International Relations": 4}, "2020": {"Indian Polity and Governance": 17, "Economy": 15, "International Relations": 3, "Modern Indian History": 9, "Ancient Indian History": 5, "Medieval Indian History": 3, "Art and Culture": 2, "Science and Technology": 12, "Environment and Ecology": 13, "Geography": 7, "Agriculture": 13, "Places in News": 1}, "2021": {"Economy": 15, "Environment and Ecology": 17, "Art and Culture": 6, "Ancient Indian History": 3, "Modern Indian History": 8, "Medieval Indian History": 4, "International Relations": 1, "Agriculture": 5, "Geography": 10, "Science and Technology": 12, "Indian Polity and Governance": 16, "Miscellaneous": 3}, "2022": {"Economy": 16, "Indian Polity and Governance": 11, "Science and Technology": 16, "Environment and Ecology": 15, "Agriculture": 3, "Places in News": 6, "Geography": 9, "Modern Indian History": 4, "Art and Culture": 4, "Ancient Indian History": 4, "Medieval Indian History": 4, "International Relations": 8}, "2023": {"Geography": 15, "Economy": 15, "Agriculture": 3, "Places in News": 5, "Environment and Ecology": 14, "Science and Technology": 11, "Indian Polity and Governance": 16, "Ancient Indian History": 4, "Art and Culture": 5, "Medieval Indian History": 3, "Modern Indian History": 2, "International Relations": 6, "Miscellaneous": 1}, "2024": {"Geography": 19, "Agriculture": 4, "Places in News": 3, "Economy": 14, "Environment and Ecology": 13, "International Relations": 7, "Science and Technology": 8, "Ancient Indian History": 4, "Medieval Indian History": 1, "Modern Indian History": 2, "Art and Culture": 3, "Indian Polity and Governance": 19, "Miscellaneous": 3}, "2025": {"Economy": 15, "Indian Polity and Governance": 14, "Geography": 14, "Environment and Ecology": 14, "Modern Indian History": 8, "Art and Culture": 3, "Ancient Indian History": 6, "International Relations": 5, "Places in News": 3, "Agriculture": 2, "Science and Technology": 13, "Miscellaneous": 3}, "2026": {"Art and Culture": 10, "Modern Indian History": 5, "Ancient Indian History": 7, "Geography": 7, "Environment and Ecology": 9, "Economy": 17, "Agriculture": 1, "Places in News": 3, "Science and Technology": 15, "Miscellaneous": 5, "Indian Polity and Governance": 9, "International Relations": 12}};   // GS I: questions per subject in each year (filled in by build_site.py)
let curYear = null;
{ const m = location.hash.match(/^#(gs1|csat)(?:-(\d{4}))?$/); if (m){ current=m[1]; if (m[2]) curYear=+m[2]; } }
const $ = id => document.getElementById(id);

function renderTabs(){
  $('tabs').innerHTML = KEYS.map(k => `<button class="${k===current?'on':''}" role="tab" aria-selected="${k===current}" data-k="${k}">${PAPERS[k].code}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => select(b.dataset.k));
}
function renderYears(){
  const p = PAPERS[current];
  document.title = `Prelims ${p.code} — PrashnaKosh`;
  const list = $('yearList');
  if (!checked){ list.innerHTML = `<div class="pv-msg">Checking which papers are available…</div>`; $('detail').innerHTML=''; return; }
  const ys = shownYears(current);
  if (!ys.length){ list.innerHTML = `<div class="pv-msg">No papers uploaded yet for this paper.</div>`; $('detail').innerHTML=''; return; }
  if (!ys.includes(curYear)) curYear = (current==='gs1' && ys.find(y => PRE_SUBJ[y] && found[current][y].paper && found[current][y].key)) || ys.find(y => found[current][y].paper && found[current][y].key) || ys[0];
  list.innerHTML = ys.map(y => { const f=found[current][y];
    return `<button class="yi ${y===curYear?'cur':''}" data-y="${y}" ${y===curYear?'aria-current="true"':''}><b>${y}</b><span>${f.paper && f.key ? 'paper + key' : f.paper ? 'paper, key awaited' : 'key only'}</span></button>`; }).join('');
  list.querySelectorAll('.yi').forEach(b => b.onclick = () => { curYear=+b.dataset.y; history.replaceState(null,'','#'+current+'-'+curYear); renderYears(); $('pv').classList.add('detail'); $('detail').scrollTop=0; });
  renderDetail();
}
function btn(cls, href, label, ok, offLabel){
  const fname = href.split('/').pop();
  return ok
    ? `<a class="dl ${cls}" href="${href}" download="${fname}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 20h14"/></svg>${label}</a>`
    : `<span class="dl off" aria-disabled="true">${offLabel}</span>`;
}
function renderDetail(){
  const p = PAPERS[current], y = curYear, f = found[current][y];
  const subj = current==='gs1' ? PRE_SUBJ[y] : null;
  let card = '';
  if (subj){
    const rows = Object.entries(subj).sort((a,b)=>b[1]-a[1]), max = rows[0][1];
    card = `<div class="pv-card"><h2>What this paper asked</h2>${rows.map(([s,n])=>`<div class="pb"><span>${s}</span><span class="t"><i style="width:${Math.max(4,100*n/max)}%"></i></span><b>${n}</b></div>`).join('')}</div>`;
  }
  $('detail').innerHTML = `<div class="pv-in">
    <button class="pv-back" id="back">‹ All years</button>
    <div class="pv-kick">Prelims · ${p.name}</div>
    <div class="pv-year">${y}</div>
    <p class="pv-note">${p.note}</p>
    <div class="pv-acts">
      ${btn('paper', url(p, y, false), 'Question paper', f.paper, 'Paper coming soon')}
      ${btn('key', url(p, y, true), 'Answer key', f.key, 'Key not yet released')}
      ${subj ? `<a class="dl go" href="practice.html#year=${y}">Practise ${y} online →</a>` : ''}
    </div>
    ${card}
    <p class="pv-foot">${subj ? 'Subject counts use the tags on the Practice page.' : current==='gs1' ? 'This year is not on the Practice page yet.' : 'CSAT is qualifying, so it is not part of the Practice page.'} Keys cover every booklet series; match the key to the series printed on your paper.</p>
  </div>`;
  const b=$('back'); if (b) b.onclick = () => $('pv').classList.remove('detail');
}
function select(k){ if (k===current) return; current = k; curYear = null; history.replaceState(null,'','#'+k); $('pv').classList.remove('detail'); renderTabs(); renderYears(); }
window.addEventListener('hashchange', () => { const m = location.hash.match(/^#(gs1|csat)(?:-(\d{4}))?$/); if (m){ current=m[1]; curYear=m[2]?+m[2]:null; renderTabs(); renderYears(); } });
document.addEventListener('keydown', e => {
  if (!checked || !['ArrowDown','ArrowUp'].includes(e.key) || /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const ys = shownYears(current), i = ys.indexOf(curYear), j = i + (e.key==='ArrowDown'?1:-1);
  if (j<0 || j>=ys.length) return; e.preventDefault(); curYear = ys[j]; renderYears(); $('yearList').querySelector('.cur')?.scrollIntoView({block:'nearest'});
});
renderTabs(); renderYears();
